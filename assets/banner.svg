<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="pg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#336791"/>
      <stop offset="100%" stop-color="#4183b4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: url(#text-grad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    /* Dynamic CSS Keyframe Animations */
    @keyframes pulseGlow {
      0% { transform: scale(0.95); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.7; }
      100% { transform: scale(0.95); opacity: 0.3; }
    }
    @keyframes floatElem {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes waveLine {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    @keyframes barGrow {
      0% { height: 10px; y: 210px; }
      50% { height: 40px; y: 180px; }
      100% { height: 10px; y: 210px; }
    }

    .pulsing-glow { transform-origin: 150px 150px; animation: pulseGlow 4s infinite ease-in-out; }
    .floating-icon { animation: floatElem 3s infinite ease-in-out; }
    .animated-wave { stroke-dasharray: 10 10; animation: waveLine 2s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="300" rx="16" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Decorative Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Glow effect behind logo -->
  <circle cx="160" cy="150" r="120" fill="url(#glow)" class="pulsing-glow"/>

  <!-- Left Icon: PostgreSQL Elephant & Pulse Wave Graphics -->
  <g transform="translate(60, 50)" class="floating-icon" filter="url(#shadow)">
    <!-- Shield / Badge background -->
    <rect x="0" y="0" width="200" height="200" rx="32" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2"/>
    
    <!-- PostgreSQL Elephant Outline Stylized -->
    <path d="M100 40 C60 40 40 70 40 100 C40 135 65 155 90 158 C95 140 105 130 115 130 C120 130 125 135 125 145 C125 158 110 160 100 160 C70 160 50 140 50 100 C50 75 65 55 100 55 C135 55 150 75 150 100 C150 120 140 145 125 145" fill="none" stroke="url(#text-grad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="80" cy="85" r="7" fill="#38bdf8"/>
    
    <!-- Heartbeat / Pulse Line across icon -->
    <path d="M 15 110 L 55 110 L 70 80 L 85 130 L 105 60 L 125 120 L 140 100 L 185 100" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title and Subtitle Text -->
  <g transform="translate(300, 105)">
    <text x="0" y="0" class="title" filter="url(#shadow)">Awesome PostgreSQL Monitoring 🐘📊</text>
    <text x="0" y="38" class="subtitle">A Curated Ecosystem of Observability Tools, Metrics &amp; Performance Analyzers</text>
  </g>

  <!-- Feature Pill Badges -->
  <g transform="translate(300, 180)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="20" cy="18" r="6" fill="#38bdf8"/>
      <text x="36" y="23" class="badge-text">Query Analytics</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(175, 0)">
      <rect x="0" y="0" width="165" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="20" cy="18" r="6" fill="#818cf8"/>
      <text x="36" y="23" class="badge-text">EXPLAIN Insights</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(355, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="20" cy="18" r="6" fill="#c084fc"/>
      <text x="36" y="23" class="badge-text">Health Checks</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="165" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="20" cy="18" r="6" fill="#22c55e"/>
      <text x="36" y="23" class="badge-text">Open-Source &amp; SaaS</text>
    </g>
  </g>

  <!-- Right Decorative Live Metric Wave & Status Indicator -->
  <g transform="translate(1000, 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="140" height="180" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    
    <!-- Mini Status Header -->
    <circle cx="24" cy="25" r="5" fill="#22c55e"/>
    <text x="36" y="29" font-family="sans-serif" font-size="11" font-weight="700" fill="#94a3b8">SYSTEM OK</text>
    
    <!-- Animated Mini Sparkline -->
    <path d="M 15 90 Q 35 60 55 100 T 95 70 T 125 85" fill="none" stroke="#38bdf8" stroke-width="3" class="animated-wave"/>
    <path d="M 15 120 Q 35 140 55 110 T 95 130 T 125 105" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.6"/>

    <!-- Dynamic Metrics text -->
    <text x="15" y="155" font-family="monospace" font-size="10" fill="#64748b">TPS: 12,450</text>
    <text x="15" y="168" font-family="monospace" font-size="10" fill="#64748b">LAT: 0.42ms</text>
  </g>
</svg>
